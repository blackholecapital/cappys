name = "cappys-api"
main = "src/index.ts"
account_id = "841893af4dee7e52549a8adbef936100"
compatibility_date = "2026-08-28"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[vars]
TENANT_ID = "cappys-electrical"
ALLOWED_ORIGIN = "https://cappys.blackholecapital.xyz"
EILA_RUNTIME_URL = ""

[assets]
directory = "../web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/twilio/*"]

[[routes]]
pattern = "cappys.blackholecapital.xyz"
custom_domain = true

[[d1_databases]]
binding = "DB"
database_name = "cappys-db"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "cappys-media"

[[queues.producers]]
binding = "JOBS"
queue = "cappys-jobs"

[[queues.consumers]]
queue = "cappys-jobs"
max_batch_size = 10
max_batch_timeout = 5

[[services]]
binding = "PAYME"
service = "checkout-worker"

[[services]]
binding = "VIDEO"
service = "blackhole-video-worker"

[[services]]
binding = "VOICE"
service = "blackhole-voice-worker"

[[analytics_engine_datasets]]
binding = "ANALYTICS"
dataset = "cappys_events"

[observability]
enabled = true
head_sampling_rate = 1
